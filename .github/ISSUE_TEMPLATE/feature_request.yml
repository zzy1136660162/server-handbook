name: Feature request / 功能建议
description: Explain a server-maintenance task this project could support.
title: "[Feature]: "
body:
  - type: textarea
    id: task
    attributes:
      label: User task / 使用场景
      description: What are you trying to accomplish, and what currently gets in the way?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome / 期望结果
      description: Describe the observable behavior that would solve the task.
    validations:
      required: true
