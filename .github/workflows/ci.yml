name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-package:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[mcp,dev]"
      - run: python -m pytest -q
      - run: python -m build

  real-compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[mcp,dev]"
      - run: docker pull nginx:alpine
      - run: python -m pytest -q -s tests/test_docker_integration.py
        env:
          SERVER_HANDBOOK_DOCKER_TESTS: "1"

  ci-success:
    if: always()
    needs: [unit-and-package, real-compose]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all validation jobs
        env:
          UNIT_RESULT: ${{ needs['unit-and-package'].result }}
          COMPOSE_RESULT: ${{ needs['real-compose'].result }}
        run: |
          test "$UNIT_RESULT" = success
          test "$COMPOSE_RESULT" = success
