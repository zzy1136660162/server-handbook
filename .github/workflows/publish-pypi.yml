name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version already committed in server_handbook.__version__
        required: true
        type: string
        default: "0.1.0"

permissions:
  contents: read

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'zzy1136660162/server-handbook' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
      - name: Install build and test tools
        run: python -m pip install -e ".[mcp,dev]" twine
      - name: Check the requested version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os
          from server_handbook import __version__
          requested = os.environ["RELEASE_VERSION"]
          if requested != __version__:
              raise SystemExit("Requested version does not match the committed package version.")
          print("Building Server Handbook", __version__)
          PY
      - name: Run package tests
        run: python -m pytest -q
      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*
      - name: Verify installed wheel and stdio MCP
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python tools/verify_installed.py --output verification/pypi-wheel-check.json
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: pypi-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: github.repository == 'zzy1136660162/server-handbook' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/server-handbook/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: pypi-distributions
          path: dist/
      - name: Publish through PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@v1.14.3
